- name: Configue ppa-xtradeb repository
  ansible.builtin.import_tasks: repo_xtradeb.yml
  tags:
    - ppa-xtradeb
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version >= '24.04'

- name: APT-Cache cleanup
  ansible.builtin.apt:
    clean: true

- name: Remove superfluous applications
  ansible.builtin.apt:
    pkg:
    - aisleriot
    - cheese
    - gnome-mahjongg
    - gnome-mines
    - gnome-sudoku
    - imagemagick
    - transmission-common
    - transmission-gtk
    - usb-creator-common
    - usb-creator-gtk
    state: absent
    autoremove: true
  tags:
    - rm-apps
    
- name: Software from native sources
  ansible.builtin.apt:
    update_cache: true
    install_recommends: true
    pkg:
    - playonlinux
    - bing
    - ceph-common
    - ceph-fuse
    - cowsay
    - cryptsetup
    - curl
    - exfat-fuse
    - exfatprogs
    - expect
    - evolution
    - fdisk
    - gdisk # has been removed with usb-creator - reinstallation
    - ghex
    - gnome-tweaks
    - gparted
    - grub-efi-amd64-bin
    - grub-efi-amd64-signed
    - htop
    - ipython3
    - language-pack-de-base
    - language-pack-de
    - language-pack-gnome-de-base
    - language-pack-gnome-de
    - language-pack-en-base
    - language-pack-en
    - language-pack-gnome-en-base
    - language-pack-gnome-en
    - language-selector-common
    - language-selector-gnome
    - libreoffice-help-de
    - libreoffice-l10n-de
    - libfuse2
    - libxml2-utils
    - ntfs-3g
    - okteta
    - openssh-client
    - openssh-server
    - python3
    - python3-pip
    - python3-venv
    - shim
    - shim-signed
    - ssh-import-id
    - sshpass
    - unison-gtk
    - unzip
    - vim
    - vlc
    - xfsprogs
  tags:
    - misc-from-native

- name: additional packages from native sources for ag systems
  become: true
  ansible.builtin.command:
    argv:
      - apt-get
      - download
      - "{{ item }}"
    chdir: /var/tmp
  loop:
  - ldap-utils
  - grass-doc
  - grass-core
  - nvidia-dkms-535
  - nvidia-kernel-source-535
  - nvidia-kernel-common-535
  - libnvidia-extra-535
  - libnvidia-common-535
  - libnvidia-gl-535
  - libnvidia-decode-535
  - libnvidia-compute-535
  - nvidia-compute-utils-535
  - libnvidia-encode-535
  - nvidia-utils-535
  - xserver-xorg-video-nvidia-535
  - libnvidia-cfg1-535
  - libnvidia-fbc1-535

- name: Upgrade system
  ansible.builtin.apt:
    update_cache: yes
    upgrade: yes
    autoremove: yes
    purge: yes
  tags:
    - upgrade

- name: Disable gnome keyring
  ansible.builtin.command: rm /etc/xdg/autostart/gnome-keyring-*.desktop
  ignore_errors: true

- name: Install common used multimedia packages excluding M$ ttf fonts
  ansible.builtin.command: apt install -y ubuntu-restricted-extras ttf-mscorefonts-installer-
  tags:
    - multimedia

- name: Install M$ vscode
  ansible.builtin.import_tasks: vscode.yml
  tags:
    - microsoft-vscode

- name: Install ungoogled-chromium browser
  ansible.builtin.import_tasks: appadd-ungoogled-chromium.yml
  when: appadd_ungoogled_chromium and ansible_distribution == 'Ubuntu' and ansible_distribution_version >= '24.04'
  tags:
    - ungoogled-chromium

# as of noble the ppa hasn't the release related packages
- name: Install qgis
  ansible.builtin.import_tasks: qgis.yml
  when: appadd_qgis
  tags:
    - qgis
